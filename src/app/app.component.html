<!-- Loading while Auth0 initializes -->
<ng-container *ngIf="auth.isLoading; else ready">
  <div class="app-init-loader">
    <div class="app-init-spinner"></div>
  </div>
</ng-container>

<ng-template #ready>

  <!-- Authenticated: sidebar + content -->
  <ng-container *ngIf="auth.isAuthenticated; else noLayout">
    <div class="app-layout">
      <app-sidebar></app-sidebar>
      <main class="main-content">
        <div class="main-topbar">
          <app-notification-bell></app-notification-bell>
        </div>
        <div class="main-content__scroll">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>
  </ng-container>

  <!-- Public pages (login, etc.) -->
  <ng-template #noLayout>
    <router-outlet></router-outlet>
  </ng-template>

</ng-template>

<app-toast></app-toast>

<style>
.app-init-loader {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: #0f172a;
}
.app-init-spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(99,102,241,.2);
  border-top-color: #6366f1;
  border-radius: 50%;
  animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.main-topbar {
  flex-shrink: 0;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 1rem;
  border-bottom: 1px solid var(--gray-100, #f1f5f9);
  background: var(--white, #fff);
}
.main-content__scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  min-width: 0;
}
</style>
