<!-- /lealtad/consulta: pública, sin layout de staff ni espera de auth.isLoading,
     incluso con una sesión de staff ya autenticada (spec "Unguarded Public
     Consulta Route"). -->
<ng-container *ngIf="isPublicLealtad; else staffShell">
  <router-outlet></router-outlet>
</ng-container>

<ng-template #staffShell>

  <!-- Loading while Auth0 initializes -->
  <ng-container *ngIf="auth.isLoading; else ready">
    <div class="app-init-loader">
      <div class="app-init-spinner"></div>
    </div>
  </ng-container>

  <ng-template #ready>

    <!-- Authenticated: sidebar + content. El sidebar global se oculta bajo
         /lealtad/** (el shell de Lealtad trae el suyo propio). -->
    <ng-container *ngIf="auth.isAuthenticated; else noLayout">
      <div class="app-layout">
        <app-sidebar *ngIf="showGlobalSidebar"></app-sidebar>
        <main class="main-content">
          <!-- Fuera del scroll: queda fijo arriba en todas las vistas. -->
          <app-aviso-credenciales-sat></app-aviso-credenciales-sat>
          <div class="main-content__scroll">
            <router-outlet></router-outlet>
          </div>
        </main>
      </div>
    </ng-container>

    <!-- Public pages (login, etc.) -->
    <ng-template #noLayout>
      <router-outlet></router-outlet>
    </ng-template>

  </ng-template>

</ng-template>

<app-transition-overlay></app-transition-overlay>
<app-toast></app-toast>

<style>
.app-init-loader {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: #0f172a;
}
.app-init-spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(99,102,241,.2);
  border-top-color: #6366f1;
  border-radius: 50%;
  animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.main-content__scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  min-width: 0;
}
</style>
