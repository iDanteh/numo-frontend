<!-- Pila (2026-11-24): el más nuevo abajo; al quitarse uno los demás bajan sin encimarse. -->
<div class="toast-container">
  <div
    *ngFor="let t of items; trackBy: trackId"
    class="toast-item toast--{{ t.type }}"
    [class.toast--leaving]="t.leaving"
    [class.toast--fijo]="!!t.clave"
    [attr.role]="t.clave ? 'status' : null"
    (click)="clic(t)"
  >
    <span class="toast-icon" [class.toast-icon--girando]="t.girando">{{ icon(t.type) }}</span>
    <span class="toast-msg">{{ t.message }}</span>
    <button type="button" class="toast-close" (click)="$event.stopPropagation(); dismiss(t.id)" title="Cerrar aviso" aria-label="Cerrar aviso">✕</button>
  </div>
</div>

<style>
.toast-container {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  pointer-events: none;
}

.toast-item {
  display: flex;
  align-items: center;
  gap: .6rem;
  padding: .65rem 1rem;
  border-radius: 8px;
  border-left: 4px solid;
  font-size: .875rem;
  font-weight: 500;
  min-width: 240px;
  max-width: 380px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06);
  pointer-events: all;
  cursor: pointer;
  animation: toast-in .28s cubic-bezier(.22,1,.36,1) both;
  /* Separación con margen (no gap) para que al encogerse no quede hueco. */
  margin-top: .5rem;
  max-height: 14rem;
  overflow: hidden;
  transition: opacity .28s, transform .28s, max-height .28s, margin-top .28s, padding-top .28s, padding-bottom .28s;
  color: #1e293b;
}

/* Al quitarse se encoge: los de arriba bajan suavemente a su lugar. */
.toast-item.toast--leaving {
  opacity: 0;
  transform: translateX(1.5rem);
  max-height: 0;
  margin-top: 0;
  padding-top: 0;
  padding-bottom: 0;
}

.toast--success { background: #d1fae5; border-color: #10b981; }
.toast--error   { background: #fee2e2; border-color: #ef4444; }
.toast--warning { background: #fef3c7; border-color: #f59e0b; }
.toast--info    { background: #dbeafe; border-color: #3b82f6; }
/* Aviso fijo naranja (p. ej. "el reporte puede tardar"), solo se quita con la ✕. */
.toast--aviso   { background: #f97316; border-color: #c2410c; color: #ffffff; }
.toast-item.toast--fijo { cursor: default; }

.toast-icon {
  font-size: 1rem;
  flex-shrink: 0;
  width: 1.25rem;
  text-align: center;
}

.toast--success .toast-icon { color: #10b981; }
.toast--error   .toast-icon { color: #ef4444; }
.toast--warning .toast-icon { color: #f59e0b; }
.toast--info    .toast-icon { color: #3b82f6; }

/* Reloj de arena girando mientras se calcula (2026-11-24). */
.toast-icon--girando {
  display: inline-block;
  animation: toast-girar 1.6s ease-in-out infinite;
}
@keyframes toast-girar {
  0%   { transform: rotate(0deg); }
  50%  { transform: rotate(180deg); }
  100% { transform: rotate(360deg); }
}

.toast-msg {
  flex: 1;
  line-height: 1.4;
}

.toast-close {
  background: none;
  border: none;
  color: #94a3b8;
  cursor: pointer;
  font-size: .8rem;
  padding: 0;
  flex-shrink: 0;
  line-height: 1;
}
.toast-close:hover { color: #475569; }
.toast--aviso .toast-close { color: #ffffff; font-size: 1rem; }
.toast--aviso .toast-close:hover { color: #7c2d12; }

@keyframes toast-in {
  from { opacity: 0; transform: translateX(1.5rem); }
  to   { opacity: 1; transform: translateX(0); }
}
</style>
