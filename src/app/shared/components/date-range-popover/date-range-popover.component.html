<div class="drp-wrap" [class.drp-field]="variant === 'field'">
  <button #triggerBtn
          type="button"
          class="date-range-btn"
          [class.drp-field]="variant === 'field'"
          [class.date-range-active]="fechaInicio || fechaFin"
          [disabled]="disabled"
          (click)="toggle($event)">
    <svg width="13" height="13" viewBox="0 0 20 20" fill="none"
         stroke="currentColor" stroke-width="1.8">
      <rect x="3" y="4" width="14" height="13" rx="2"/>
      <path d="M3 8h14M7 2v4M13 2v4"/>
    </svg>
    <span class="date-range-val">{{ label }}</span>
    <span *ngIf="fechaInicio || fechaFin"
          class="date-range-clear"
          [class.drp-field]="variant === 'field'"
          (click)="clear($event)"
          title="Limpiar rango">✕</span>
  </button>
</div>

<div #popupEl
     [hidden]="!visible"
     class="cal-popup"
     [style.top.px]="calPopupTop"
     [style.left.px]="calPopupLeft"
     (click)="$event.stopPropagation()">
  <div class="cal-header" (mousedown)="onCalDragStart($event)">
    <button class="cal-nav" (click)="calPrev()">&#8249;</button>
    <span class="cal-month-label">
      <svg class="cal-drag-icon" width="10" height="10" viewBox="0 0 20 20" fill="currentColor">
        <circle cx="7" cy="5"  r="1.6"/><circle cx="13" cy="5"  r="1.6"/>
        <circle cx="7" cy="10" r="1.6"/><circle cx="13" cy="10" r="1.6"/>
        <circle cx="7" cy="15" r="1.6"/><circle cx="13" cy="15" r="1.6"/>
      </svg>
      {{ calMonthLabel }}
    </span>
    <button class="cal-nav" (click)="calNext()">&#8250;</button>
  </div>
  <div class="cal-grid">
    <div *ngFor="let dow of CAL_DIAS" class="cal-dow">{{ dow }}</div>
    <div *ngFor="let day of calDaysArr"
         class="cal-day"
         [class.cal-other-month]="!day.inMonth"
         [class.cal-today]="isDayToday(day.iso)"
         [class.cal-start]="isDayStart(day.iso)"
         [class.cal-end]="isDayEnd(day.iso)"
         [class.cal-in-range]="isDayInRange(day.iso)"
         (click)="onCalClick(day.iso)"
         (mouseenter)="onCalHover(day.iso)">
      {{ day.day }}
    </div>
  </div>
  <div class="cal-hint" *ngIf="pickerStart && !pickerEnd">
    Selecciona la fecha de fin
  </div>
  <div class="cal-footer" *ngIf="pickerStart && pickerEnd">
    <button class="cal-clear-btn" (click)="clear()">Limpiar rango</button>
  </div>
</div>
