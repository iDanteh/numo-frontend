<div *ngIf="show" class="modal-backdrop" (click)="close.emit()">
  <div class="confirm-box"
       [class.confirm-box--danger]="cls === 'btn-confirm-danger'"
       [class.confirm-box--success]="cls === 'btn-confirm-success'"
       [class.confirm-box--warning]="cls === 'btn-confirm-warning'"
       (click)="$event.stopPropagation()">

    <!-- Icono -->
    <div class="confirm-icon-wrap"
         [class.confirm-icon-success]="cls === 'btn-confirm-success'"
         [class.confirm-icon-danger]="cls === 'btn-confirm-danger'"
         [class.confirm-icon-warning]="cls === 'btn-confirm-warning'">
      <ng-container *ngIf="cls === 'btn-confirm-danger'">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </ng-container>
      <ng-container *ngIf="cls === 'btn-confirm-success'">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
      </ng-container>
      <ng-container *ngIf="cls === 'btn-confirm-warning'">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </ng-container>
    </div>

    <!-- Título y mensaje -->
    <div class="confirm-title">{{ title }}</div>
    <div class="confirm-msg" [innerHTML]="msg"></div>

    <!-- Motivo (cancelar / revertir) -->
    <div *ngIf="showMotivo" class="confirm-motivo-wrap">
      <label class="confirm-motivo-label">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Motivo <span class="confirm-motivo-optional">(opcional)</span>
      </label>
      <textarea [ngModel]="motivo" (ngModelChange)="motivoChange.emit($event)" rows="3"
                class="confirm-motivo-input"
                placeholder="Describe brevemente el motivo…"
                (click)="$event.stopPropagation()"></textarea>
    </div>

    <!-- Revertir cuentas bancarias resueltas (solo revertir a borrador) -->
    <div *ngIf="showRevertirCuentas" class="confirm-motivo-wrap" (click)="$event.stopPropagation()">
      <label style="display:flex;align-items:center;gap:.5rem;font-size:.78rem;cursor:pointer">
        <input type="checkbox" [ngModel]="revertirCuentas" (ngModelChange)="revertirCuentasChange.emit($event)">
        También revertir las cuentas bancarias que se resolvieron al contabilizar
      </label>
    </div>

    <!-- Aviso de auditoría (solo danger) -->
    <div *ngIf="cls === 'btn-confirm-danger'" class="confirm-danger-notice">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Esta acción quedará registrada en el historial de auditoría
    </div>

    <!-- Acciones -->
    <div class="confirm-actions">
      <button class="btn btn-secondary" (click)="close.emit()">Volver</button>
      <button class="btn" [ngClass]="cls" (click)="run.emit()">{{ btn }}</button>
    </div>

  </div>
</div>
