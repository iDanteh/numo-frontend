<app-modal
  [title]="mode === 'acumulacion' ? 'Registrar acumulación' : (mode === 'canje' ? 'Registrar canje' : 'Registrar ajuste')"
  size="sm"
  (close)="closed.emit()">

  <ng-container *ngIf="mode === 'acumulacion'">
    <!-- Serie-Folio (2026-10-21): reemplaza el select de sucursal Y el monto
         de venta manual — el backend resuelve la serie (ej. "A0") contra
         CentroCosto, consulta la venta real en Kore y calcula los puntos
         sobre su subtotal. Sin preview en vivo: el monto no se conoce hasta
         que el backend responde. -->
    <div class="form-field">
      <label class="form-label">Serie-Folio de la venta</label>
      <input class="form-input" type="text" [(ngModel)]="serieFolio" [disabled]="saving" placeholder="ej. A0-260605320">
    </div>
  </ng-container>

  <ng-container *ngIf="mode === 'canje'">
    <p class="mm-saldo">Saldo actual: <strong>{{ card.saldoPuntos | number: '1.2-2' }}</strong> puntos</p>
    <div class="form-field">
      <label class="form-label">Puntos a canjear</label>
      <input class="form-input" type="number" min="0" step="0.01" [(ngModel)]="puntos" [disabled]="saving">
    </div>
    <!-- Serie (2026-10-21): reemplaza el select de sucursal — el backend la
         resuelve contra CentroCosto.serieFacturacion. -->
    <div class="form-field">
      <label class="form-label">Serie de la sucursal</label>
      <input class="form-input" type="text" [(ngModel)]="serie" [disabled]="saving" placeholder="ej. A0">
    </div>
  </ng-container>

  <ng-container *ngIf="mode === 'ajuste'">
    <div class="form-field">
      <label class="form-label">Motivo</label>
      <select class="form-input" [(ngModel)]="reasonId" (ngModelChange)="onReasonChange()" [disabled]="saving">
        <option [ngValue]="null">Selecciona…</option>
        <option *ngFor="let r of activeReasons()" [ngValue]="r.id">{{ r.nombre }}</option>
      </select>
    </div>
    <ng-container *ngIf="selectedReason()?.puntosFijos != null; else puntosManual">
      <p class="mm-preview" *ngIf="ajustePreview() !== null">
        Se {{ ajustePreview()! > 0 ? 'sumarán' : 'restarán' }} <strong>{{ ajustePreview() }}</strong> puntos.
      </p>
    </ng-container>
    <ng-template #puntosManual>
      <div class="form-field">
        <label class="form-label">Puntos (+/-)</label>
        <input class="form-input" type="number" step="0.01" [(ngModel)]="puntos" [disabled]="saving">
      </div>
    </ng-template>
    <div class="form-field">
      <label class="form-label">Justificación</label>
      <textarea class="form-input" rows="3" [(ngModel)]="justificacion" [disabled]="saving"
                placeholder="Explica el motivo de este ajuste…"></textarea>
    </div>
  </ng-container>

  <p *ngIf="error" class="form-error">{{ error }}</p>

  <div modal-footer>
    <button type="button" class="btn-ghost" [disabled]="saving" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn btn-primary" [disabled]="saving" (click)="guardar()">
      <div *ngIf="saving" class="spinner spinner-sm"></div>
      {{ saving ? 'Guardando…' : 'Registrar' }}
    </button>
  </div>
</app-modal>
