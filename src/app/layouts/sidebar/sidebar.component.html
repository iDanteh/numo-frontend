<nav class="sb" [class.sb--collapsed]="collapsed"
     [style.--sb-width.px]="collapsed ? 56 : 240"
     [style.--sb-brand-h.px]="collapsed ? 96 : 64">

  <!-- ── Brand ──────────────────────────────────────────────── -->
  <div class="sb__brand">
    <div class="sb__logo">
      <img src="numo-N.svg" alt="NUMO" class="sidebar-logo">
      <div class="sb__logo-text">
        <span class="sb__logo-name">NUMO</span>
        <span class="sb__logo-sub">Sistema contable</span>
      </div>
    </div>
    <button class="sb__toggle"
            type="button"
            (click)="toggle()"
            [title]="collapsed ? 'Expandir menú' : 'Colapsar menú'">
      <svg [lucideIcon]="collapsed ? 'panel-left' : 'panel-left-close'" [size]="16" [strokeWidth]="1.75"></svg>
    </button>
  </div>

  <!-- ── Notificaciones — debajo del logo, antes del nav ─────── -->
  <app-notification-bell></app-notification-bell>

  <!-- ── Scrollable navigation ──────────────────────────────── -->
  <div class="sb__scroll">
    <ng-container *ngFor="let section of sections">
      <ng-container *ngIf="sectionVisible(section)">

        <span class="sb__section">{{ section.label }}</span>

        <ng-container *ngFor="let item of section.items">
          <ng-container *ngIf="canSee(item.permissions)">

            <!-- Ítem con submenú (ej. Asientos Contables → Ingreso/Cobranza) -->
            <ng-container *ngIf="item.children?.length; else leafLink">
              <button type="button"
                      class="sb__link sb__link--parent"
                      [class.sb__link--active]="hasActiveChild(item)"
                      [attr.aria-haspopup]="collapsed ? 'menu' : null"
                      [attr.aria-expanded]="collapsed ? (flyoutItem === item) : isExpanded(item)"
                      (click)="toggleExpand(item)"
                      (mouseenter)="onParentTriggerEnter(item, $event)"
                      (mouseleave)="scheduleFlyoutClose()"
                      (focus)="onParentTriggerEnter(item, $event)"
                      (blur)="scheduleFlyoutClose()"
                      [title]="item.label">
                <span class="sb__icon"><svg [lucideIcon]="item.icon" [size]="18" [strokeWidth]="1.75"></svg></span>
                <span class="sb__label">{{ item.label }}</span>
                <svg class="sb__chevron" [lucideIcon]="isExpanded(item) ? 'chevron-down' : 'chevron-right'" [size]="14" [strokeWidth]="2"></svg>
              </button>
              <div class="sb__children" *ngIf="!collapsed && isExpanded(item)">
                <a *ngFor="let child of item.children"
                   [routerLink]="child.route"
                   [class.sb__link--active]="isChildActive(child)"
                   class="sb__link sb__link--child"
                   [title]="child.label">
                  <span class="sb__icon"><svg [lucideIcon]="child.icon" [size]="16" [strokeWidth]="1.75"></svg></span>
                  <span class="sb__label">{{ child.label }}</span>
                </a>
              </div>
            </ng-container>

            <!-- Ítem simple (sin submenú) -->
            <ng-template #leafLink>
              <a [routerLink]="item.route"
                 routerLinkActive="sb__link--active"
                 class="sb__link"
                 [title]="item.label">
                <span class="sb__icon"><svg [lucideIcon]="item.icon" [size]="18" [strokeWidth]="1.75"></svg></span>
                <span class="sb__label">{{ item.label }}</span>
              </a>
            </ng-template>

          </ng-container>
        </ng-container>

      </ng-container>
    </ng-container>
  </div>

  <!-- ── Flyout: hijos de un ítem padre cuando el sidebar está colapsado ── -->
  <div class="sb__flyout"
       *ngIf="flyoutItem as fi"
       [style.top.px]="flyoutTop"
       (mouseenter)="cancelFlyoutClose()"
       (mouseleave)="scheduleFlyoutClose()">
    <div class="sb__flyout-title">{{ fi.label }}</div>
    <a *ngFor="let child of fi.children"
       [routerLink]="child.route"
       [class.sb__link--active]="isChildActive(child)"
       class="sb__flyout-link"
       (click)="closeFlyout()">
      <span class="sb__icon"><svg [lucideIcon]="child.icon" [size]="16" [strokeWidth]="1.75"></svg></span>
      <span>{{ child.label }}</span>
    </a>
  </div>

  <!-- ── Footer: user + logout — always visible ──────────────── -->
  <div class="sb__footer">
    <div class="sb__user">
      <ng-container *ngIf="auth.currentUser.picture; else initials">
        <img class="sb__avatar sb__avatar--photo"
             [src]="auth.currentUser.picture"
             [alt]="auth.currentUser.name"
             referrerpolicy="no-referrer">
      </ng-container>
      <ng-template #initials>
        <div class="sb__avatar sb__avatar--initials">
          {{ (auth.currentUser.name || 'U')[0].toUpperCase() }}
        </div>
      </ng-template>
      <div class="sb__user-info">
        <div class="sb__user-name">{{ auth.currentUser.name }}</div>
        <div class="sb__user-role">{{ auth.currentUser.role }}</div>
      </div>
    </div>
    <button class="sb__logout" type="button" (click)="logout()" title="Cerrar sesión">
      <span class="sb__icon"><svg [lucideIcon]="'log-out'" [size]="16" [strokeWidth]="1.75"></svg></span>
      <span class="sb__label">Cerrar sesión</span>
    </button>
  </div>
</nav>
